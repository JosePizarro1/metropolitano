{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metropolitano - Iniciar Sesión</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #0f4c75;
            --primary-light: #3282b8;
            --accent: #bbe1fa;
            --dark: #1b262c;
            --bg-gradient: linear-gradient(135deg, #1b262c 0%, #0f4c75 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract shapes */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(50, 130, 184, 0.3);
            top: -100px;
            right: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: rgba(187, 225, 250, 0.2);
            bottom: -50px;
            left: -50px;
        }

        .login-wrap {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            z-index: 10;
        }

        .login-container {
            display: flex;
            background: var(--glass);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            min-height: 600px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-image {
            flex: 1.2;
            background: url('{% static "images/login-bg.png" %}') center/cover no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 50px;
            color: white;
            transition: transform 0.5s ease;
        }

        .login-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 60%);
        }

        .image-content {
            position: relative;
            z-index: 2;
        }

        .login-image h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .login-image p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 350px;
            line-height: 1.6;
        }

        .login-form-area {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            margin-bottom: 40px;
        }

        .brand .tagline {
            color: var(--primary-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .brand h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            color: var(--dark);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--dark);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            background: white;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(50, 130, 184, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember {
            display: flex;
            align-items: center;
            color: #64748b;
            cursor: pointer;
        }

        .remember input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .forgot a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot a:hover {
            color: var(--primary);
        }

        .login-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(15, 76, 117, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .login-button:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(15, 76, 117, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .admin-link {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .admin-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .admin-link a:hover {
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .login-container {
                flex-direction: column;
                min-height: auto;
            }

            .login-image {
                padding: 40px;
                min-height: 250px;
            }

            .login-image h1 {
                font-size: 2.2rem;
            }

            .login-form-area {
                padding: 40px 30px;
            }
        }

        @media (max-width: 480px) {
            .options {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="login-wrap">
        <div class="login-container">
            <div class="login-image">
                <div class="image-content">
                    <h1>Metropolitano</h1>
                    <p>Seguimiento de Atención Integral y Control de Pacientes.</p>
                </div>
            </div>

            <div class="login-form-area">
                <div class="brand">
                    <span class="tagline">Bienvenido</span>
                    <h2>Iniciar Sesión</h2>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" name="username" id="username" placeholder="Tu nombre de usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Recordarme
                        </label>
                        <div class="forgot">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                    </div>

                    <button type="submit" class="login-button">
                        Ingresar al Sistema
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M12 5L19 12L12 19" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

                <div class="admin-link">
                    <a href="{% url 'admin:index' %}">Acceso Administrativo</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% if messages %}
    <script>
        {% for message in messages %}
        Swal.fire({
            icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}",
            title: "{{ message|escapejs }}",
            confirmButtonColor: '#0f4c75',
            confirmButtonText: "Aceptar",
            customClass: {
                popup: 'rounded-card'
            }
        });
        {% endfor %}
    </script>
    {% endif %}
</body>

</html>
