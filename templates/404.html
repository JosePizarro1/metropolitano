<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado | Metropolitano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-24 bg-blue-900 -skew-y-3 -translate-y-12"></div>
    
    <div class="text-center relative z-10 bg-white p-12 rounded-[2rem] shadow-2xl max-w-lg w-full border-b-8 border-blue-600">
        <div class="mb-4 inline-flex items-center justify-center w-20 h-20 bg-blue-50 text-blue-600 rounded-2xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        
        <h1 class="text-8xl font-black text-slate-200 mb-2">404</h1>
        <h2 class="text-3xl font-bold text-slate-800 mb-4">Página no disponible</h2>
        
        <div class="h-1.5 w-16 bg-blue-600 mx-auto rounded-full mb-8"></div>
        
        <p class="text-slate-500 mb-10 text-lg leading-relaxed">
            Metropolitano informa que la dirección solicitada no existe o ha sido movida temporalmente.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="px-8 py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-200 transition-all transform hover:-translate-y-1 active:translate-y-0">
                Regresar al Inicio
            </a>
            <button onclick="history.back()" class="px-8 py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl hover:bg-slate-200 transition-all">
                Volver atrás
            </button>
        </div>
        
        <div class="mt-12 text-slate-400 text-sm font-medium tracking-widest uppercase">
            Metropolitano &copy; 2026
        </div>
    </div>
</body>
</html>
