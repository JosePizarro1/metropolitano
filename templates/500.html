<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Error del Servidor | Metropolitano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#0f4c75] flex items-center justify-center min-h-screen p-6 relative overflow-hidden">
    <!-- Medical/Tech Background decoration -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <pattern id="medical-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M10 20h40M30 0v40" stroke="#fff" stroke-width="2" fill="none" opacity="0.3"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#medical-pattern)" />
        </svg>
    </div>
    
    <div class="text-center relative z-10 bg-white/10 backdrop-blur-xl p-12 rounded-[2.5rem] shadow-[0_50px_100px_rgba(0,0,0,0.5)] max-w-xl w-full border border-white/20">
        <div class="mb-6 inline-flex items-center justify-center w-24 h-24 bg-red-500 text-white rounded-[2rem] shadow-lg shadow-red-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </div>
        
        <h1 class="text-9xl font-black text-white/10 -mt-10 mb-2">500</h1>
        <h2 class="text-4xl font-bold text-white mb-6 transform -translate-y-8">Error de Sistema</h2>
        
        <div class="h-1.5 w-24 bg-red-400 mx-auto rounded-full mb-8 shadow-sm"></div>
        
        <p class="text-blue-100 mb-10 text-xl font-medium leading-relaxed px-4">
            Metropolitano informa una saturación técnica momentánea. Estamos trabajando en el diagnóstico y solución del incidente.
        </p>
        
        <div class="flex flex-col gap-4 items-stretch px-8">
            <a href="/" class="px-8 py-5 bg-white text-blue-900 font-bold rounded-2xl hover:bg-blue-50 hover:shadow-2xl transition-all transform hover:-translate-y-1 active:translate-y-0 text-lg">
                Reintentar conexión
            </a>
            <p class="text-blue-300 text-sm italic font-medium">Si el problema persiste, contacte con Soporte IT.</p>
        </div>
        
        <div class="mt-14 flex items-center justify-center gap-3">
            <div class="w-2 h-2 bg-red-400 rounded-full animate-pulse"></div>
            <span class="text-blue-200 text-xs font-black tracking-[0.3em] uppercase">Metropolitano Critical Alert</span>
        </div>
    </div>
</body>
</html>
